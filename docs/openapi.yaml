openapi: 3.1.0
info:
  title: Batmeori API
  version: 2.0.0
  description: >-
    Provider-neutral P0 REST contract. New P0 publishes use structure-v2 and
    ontology-v2 for onion and strawberry, vi/ne, quantity
    changes, CO_PRESENT owner briefing, REMOTE anonymous language links, and
    a 24-hour anonymous today-team QR roster for person-specific assignments.
    Owner mutations require a signed workspace/team cookie and exact allowed Origin, except the explicitly public start and credential endpoints;
    worker links require neither. Clients never submit owner_id or farm_id.
    Issued worker URLs are browser /w/{token} routes.
servers:
  - url: https://api.example.invalid
    description: Deployment value is supplied by environment.
tags:
  - name: Owner
  - name: Worker
  - name: Team
  - name: System
paths:
  /api/v1/owner/start:
    post:
      tags: [Owner]
      summary: Start or resume an input-free temporary team workspace
      description: Exact Origin and rate limit required. Random UUID Idempotency-Key reuses pending workspace on retry. Pending expires after one hour; first atomic publish activates the team's fixed 24 hours. An existing valid temporary-team cookie resumes its team; a legacy farm cookie starts a new temporary workspace.
      security: []
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201': { description: Workspace cookie issued., content: { application/json: { schema: { $ref: '#/components/schemas/OwnerSession' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/v1/owner/team-session:
    post:
      tags: [Owner]
      summary: Resume an active temporary team with its management link and PIN
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TeamPinLoginRequest' } } }
      responses:
        '201': { description: Team-scoped secure cookie issued., content: { application/json: { schema: { $ref: '#/components/schemas/OwnerSession' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/v1/work-team-members/me/assignments/{sessionId}/acknowledgement:
    post:
      tags: [Worker, Team]
      summary: Explicitly acknowledge the currently displayed assigned version
      description: Exact Origin required. Checks active member assignment and team expiry. Same-version retry preserves first acknowledged_at; stale version is 409. Reading alone never acknowledges.
      security: [{ teamMemberSession: [] }]
      parameters:
        - in: path
          name: sessionId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, additionalProperties: false, required: [expected_version], properties: { expected_version: { type: integer, minimum: 1 } } } } }
      responses:
        '200': { description: Recorded acknowledgement., content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentReceipt' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/owner/session:
    post:
      tags: [Owner]
      summary: Legacy provisioned-farm authentication compatibility endpoint
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PinLoginRequest' }
      responses:
        '201':
          description: Session issued.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly; Secure; SameSite=None cookie. Later owner mutations also require exact allowed Origin.
          content: { application/json: { schema: { $ref: '#/components/schemas/OwnerSession' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
    get:
      tags: [Owner]
      summary: Read the current owner session and farm
      security: [{ ownerSession: [] }]
      responses:
        '200': { description: Current farm-scoped owner session., content: { application/json: { schema: { $ref: '#/components/schemas/OwnerSession' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Owner]
      summary: Clear the current owner session cookie
      security: []
      responses:
        '204': { description: Session cookie cleared. }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/work-sessions/drafts/from-audio:
    post:
      tags: [Owner]
      summary: Synchronously transcribe and structure an owner draft
      description: Raw audio is temporary and deleted after processing. No version or localized media package is created. Translation and approved-video matching occur at publish; the published storyboard reads the stored briefing.
      security: [{ ownerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio: { type: string, format: binary, description: audio/webm, audio/mp4, or audio/wav; max 10 MiB and 60 seconds. }
                language_hint: { type: string, enum: [ko], default: ko }
      responses:
        '200': { description: structure-v2 draft generated., content: { application/json: { schema: { $ref: '#/components/schemas/WorkDraft' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/v1/work-sessions/drafts/{draftId}:
    get:
      tags: [Owner]
      summary: Recover an active structure-v2 draft without raw audio
      description: Same-Farm owner only. Returns no-store; missing, expired, and cross-Farm drafts are generalized as NOT_FOUND.
      security: [{ ownerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/DraftId' }]
      responses:
        '200':
          description: Active draft recovered.
          headers: { Cache-Control: { schema: { type: string, const: no-store } } }
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkDraft' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/work-sessions/drafts/{draftId}/supplement:
    post:
      tags: [Owner]
      summary: Merge one owner audio supplement into a draft
      security: [{ ownerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, expected_draft_revision]
              properties:
                audio: { type: string, format: binary, description: audio/webm, audio/mp4, or audio/wav; max 10 MiB and 60 seconds. }
                expected_draft_revision: { type: integer, minimum: 0 }
                language_hint: { type: string, enum: [ko], default: ko }
      responses:
        '200': { description: structure-v2 draft updated., content: { application/json: { schema: { $ref: '#/components/schemas/WorkDraft' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/v1/work-sessions/drafts/{draftId}/confirm:
    post:
      tags: [Owner]
      summary: Confirm a structure-v2 draft and publish immutable v1
      description: >-
        New publish accepts only structure-v2/ontology-v2 and builds both vi/ne
        WorkerBriefing packages. Delivery is selected after publish: CO_PRESENT
        reads either package and REMOTE uses the separate link-issue endpoint.
        Legacy v1 is read-only.
      security: [{ ownerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DraftConfirmRequest' } } }
      responses:
        '201': { description: structure-v2 immutable v1 published with vi/ne WorkerBriefing packages., content: { application/json: { schema: { $ref: '#/components/schemas/InitialPublishResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/v1/work-sessions:
    get:
      tags: [Owner]
      summary: List owner work sessions
      security: [{ ownerSession: [] }]
      responses:
        '200': { description: Sessions., content: { application/json: { schema: { $ref: '#/components/schemas/OwnerWorkSessionList' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/work-sessions/{sessionId}:
    get:
      tags: [Owner]
      summary: Read owner work session and latest version
      security: [{ ownerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200': { description: Owner v2 view or separately marked legacy read-only view., content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/OwnerWorkSession' }, { $ref: '#/components/schemas/LegacyWorkSessionRead' }] } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/work-sessions/{sessionId}/quantity-changes/from-audio:
    post:
      tags: [Owner]
      summary: Parse quantity-change audio without storing it
      description: Parses a v2 PUBLISHED WorkSession without storing audio. Legacy v1 returns 422 LEGACY_READ_ONLY.
      security: [{ ownerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, expected_version]
              properties:
                audio: { type: string, format: binary, description: audio/webm, audio/mp4, or audio/wav; max 10 MiB and 60 seconds. }
                expected_version: { type: integer, minimum: 1 }
                language_hint: { type: string, enum: [ko], default: ko }
      responses:
        '200': { description: Parsed but not stored., content: { application/json: { schema: { $ref: '#/components/schemas/QuantityChangeParseResult' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/v1/work-sessions/{sessionId}/quantity-changes/confirm:
    post:
      tags: [Owner]
      summary: Confirm quantity and publish the next immutable version
      description: Regenerates a complete structure-v2 WorkVersion and both vi/ne WorkerBriefing packages atomically. Legacy v1 returns 422 LEGACY_READ_ONLY.
      security: [{ ownerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/QuantityChangeConfirmRequest' } } }
      responses:
        '201': { description: New version published., content: { application/json: { schema: { $ref: '#/components/schemas/OwnerWorkSession' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/v1/work-sessions/{sessionId}/worker-links:
    post:
      tags: [Owner]
      summary: Create or reissue one anonymous 24-hour language link
      security: [{ ownerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WorkerLinkIssueRequest' } } }
      responses:
        '201': { description: Raw URL returned once., content: { application/json: { schema: { $ref: '#/components/schemas/WorkerLinkIssueResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/worker-links/{token}/assignment:
    get:
      tags: [Worker]
      summary: Resolve latest published assignment through an anonymous language link
      security: []
      parameters: [{ $ref: '#/components/parameters/WorkerToken' }]
      responses:
        '200': { description: Latest stored WorkerBriefing v2., content: { application/json: { schema: { $ref: '#/components/schemas/WorkerBriefing' } } } }
        '404': { $ref: '#/components/responses/AccessDenied' }
        '410': { description: Expired token; issue a new link., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/v1/work-teams/today:
    post:
      tags: [Owner, Team]
      summary: Create or return today's anonymous QR invite
      description: Temporary owners receive their active team regardless of calendar date; pending is 409. Legacy owners retain the farm/day creation path. Repeated calls return the same QR, reconstructed from server-only secret material.
      security: [{ ownerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Existing team with the same active QR., content: { application/json: { schema: { $ref: '#/components/schemas/TodayWorkTeam' } } } }
        '201': { description: New team with QR., content: { application/json: { schema: { $ref: '#/components/schemas/TodayWorkTeam' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
    get:
      tags: [Owner, Team]
      summary: Read today's temporary roster
      security: [{ ownerSession: [] }]
      responses:
        '200': { description: Today's roster and the same active QR URL., content: { application/json: { schema: { $ref: '#/components/schemas/TodayWorkTeam' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/work-teams/today/invite/rotate:
    post:
      tags: [Owner, Team]
      summary: Explicitly rotate today's anonymous QR invite
      description: Issues a new farm/day QR and immediately invalidates the previous QR. Replaying an older Idempotency-Key returns the current active QR.
      security: [{ ownerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Today's team with the newly rotated QR., content: { application/json: { schema: { $ref: '#/components/schemas/TodayWorkTeam' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/v1/work-team-invites/{token}/join:
    post:
      tags: [Worker, Team]
      summary: Join today's team without an account
      description: Accepts only a temporary display name and vi/ne. It sets an HttpOnly member cookie scoped to the temporary team.
      security: []
      parameters: [{ $ref: '#/components/parameters/TeamInviteToken' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/JoinTeamRequest' } } }
      responses:
        '201': { description: Temporary member joined., headers: { Set-Cookie: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/TeamMember' } } } }
        '404': { $ref: '#/components/responses/AccessDenied' }
        '410': { description: Invite expired., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/work-teams/today/members/{memberId}/assignments:
    post:
      tags: [Owner, Team]
      summary: Assign a published WorkSession to a temporary team member
      security: [{ ownerSession: [] }]
      description: Exact Origin and owner cookie required. Repeating the same active member/work-session assignment is idempotent and returns the existing assignment.
      parameters: [{ $ref: '#/components/parameters/TeamMemberId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TeamAssignmentRequest' } } }
      responses:
        '201': { description: Assignment active., content: { application/json: { schema: { $ref: '#/components/schemas/TeamAssignmentMeta' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/work-team-members/me/assignments:
    get:
      tags: [Worker, Team]
      summary: Read this browser's assigned latest work states
      security: [{ teamMemberSession: [] }]
      responses:
        '200': { description: Latest states; an empty array means waiting for owner assignment., content: { application/json: { schema: { $ref: '#/components/schemas/TeamAssignmentsResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/tts/{text_hash}/{language_code}:
    get:
      tags: [Worker]
      summary: Read cached TTS audio for a published worker briefing
      security: []
      parameters:
        - in: path
          name: text_hash
          required: true
          schema: { type: string, pattern: '^[0-9a-f]{64}$' }
        - in: path
          name: language_code
          required: true
          schema: { type: string, enum: [vi, ne] }
      responses:
        '200':
          description: Cached synthesized speech.
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/AccessDenied' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/v1/brief:
    get:
      tags: [Owner]
      summary: Render latest CO_PRESENT group briefing
      security: [{ ownerSession: [] }]
      parameters:
        - in: query
          name: session_id
          required: true
          schema: { type: string }
        - in: query
          name: language_code
          required: true
          schema: { type: string, enum: [vi, ne] }
      responses:
        '200': { description: Latest stored WorkerBriefing v2., content: { application/json: { schema: { $ref: '#/components/schemas/WorkerBriefing' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /health:
    get:
      tags: [System]
      security: []
      responses:
        '200': { description: Process is alive., content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /ready:
    get:
      tags: [System]
      security: []
      responses:
        '200': { description: Dependencies ready., content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
components:
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: batmeori_owner_session
    teamMemberSession:
      type: apiKey
      in: cookie
      name: batmeori_team_member
  parameters:
    DraftId: { in: path, name: draftId, required: true, schema: { type: string } }
    SessionId: { in: path, name: sessionId, required: true, schema: { type: string } }
    WorkerToken: { in: path, name: token, required: true, schema: { type: string, minLength: 32 } }
    TeamInviteToken: { in: path, name: token, required: true, schema: { type: string, minLength: 32 } }
    TeamMemberId: { in: path, name: memberId, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8 } }
  responses:
    Unauthorized: { description: Authentication required., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Origin is not allowed., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Resource not found., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    AccessDenied: { description: Generalized invalid-link response., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    VersionConflict: { description: Expected version mismatch., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Unprocessable: { description: Schema or safety gate rejected request., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ServerError: { description: Unexpected server error., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    ProviderUnavailable: { description: AI/provider or dependency unavailable., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    TooManyRequests: { description: Rate limited., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [UNAUTHORIZED, NOT_FOUND, ACCESS_DENIED, LINK_EXPIRED, VERSION_CONFLICT, LEGACY_READ_ONLY, OVERRIDE_NOT_ALLOWED, AUDIO_UNCLEAR, SCHEMA_INVALID, PROVIDER_UNAVAILABLE, RATE_LIMITED, INTERNAL_ERROR] }
        message: { type: string }
        request_id: { type: string }
        details: { type: object, additionalProperties: true }
    PinLoginRequest:
      type: object
      additionalProperties: false
      required: [farm_code, pin]
      properties:
        farm_code: { type: string, minLength: 3, maxLength: 32, pattern: '^[a-z0-9][a-z0-9-]{2,31}$' }
        pin: { type: string, minLength: 4, maxLength: 32, writeOnly: true }
    OwnerFarm:
      type: object
      additionalProperties: false
      required: [code, display_name]
      properties:
        code: { type: string }
        display_name: { type: string }
    OwnerSession:
      type: object
      additionalProperties: false
      required: [authenticated, expires_at, farm]
      properties:
        authenticated: { type: boolean, const: true }
        expires_at: { type: string, format: date-time }
        farm: { $ref: '#/components/schemas/OwnerFarm' }
        team: { anyOf: [{ $ref: '#/components/schemas/OwnerTeamAccess' }, { type: 'null' }] }
    TeamPinLoginRequest:
      type: object
      additionalProperties: false
      required: [team_id, pin]
      properties:
        team_id: { type: string, format: uuid }
        pin: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
    OwnerTeamAccess:
      type: object
      additionalProperties: false
      required: [team_id, status, expires_at, management_url, pin]
      properties:
        team_id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, ACTIVE] }
        expires_at: { type: string, format: date-time }
        management_url: { type: [string, 'null'], format: uri }
        pin: { type: [string, 'null'], description: Owner-only management PIN. Never included in worker QR or briefing. }
    AssignmentReceipt:
      type: object
      additionalProperties: false
      required: [work_session_id, current_version, acknowledged_version, acknowledged_at]
      properties:
