openapi: 3.1.0
info:
  title: Batmeori API
  version: 1.0.0
  description: >-
    Provider-neutral P0 REST contract. P0 supports onion and strawberry,
    vi/ne/km, and quantity changes. AI interpretation and WorkVersion lifecycle
    are separate enums.
servers:
  - url: https://api.example.invalid
    description: Deployment value is supplied by environment; this URL is not a source fact.
tags:
  - name: Owner
  - name: Worker
  - name: System
paths:
  /api/v1/owner/session:
    post:
      tags: [Owner]
      summary: Issue short automatic demo-owner session cookie
      security: []
      responses:
        '201':
          description: Session issued.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly; Secure; SameSite=None cookie. Owner mutations use exact Origin validation as P0 CSRF defense; no separate CSRF header.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerSession' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/work-sessions/drafts/from-audio:
    post:
      tags: [Owner]
      summary: Synchronously transcribe, structure, translate, and match video
      description: >-
        Requires owner cookie. Raw audio is temporary during STT and deleted
        immediately on success or failure. FE shows loading and timeout at 60s.
        Returns a WorkDraft; no version is created.
      security: [{ ownerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: audio/webm or audio/mp4; max 10 MiB and 60 seconds.
                language_hint: { type: string, enum: [ko], default: ko }
      responses:
        '200':
          description: Draft generated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkDraft' }
              example:
                draft_id: d_01
                draft_revision: 0
                summary_ko: 농장주가 가리킨 곳의 양파 20망을 수확합니다.
                interpretation: AMBIGUOUS
                state:
                  task_family: ONION
                  location: { raw_text: 저짝, kind: DEICTIC, canonical_name: null }
                  location_display: 농장주가 가리킨 장소 · 현장 확인 필요
                  quantity: { value: 20, unit: 망 }
                  deadline: null
                  safety: []
                  notes: null
                  steps:
                    - { sequence: 1, task_code: ONION_HARVEST, title_ko: 양파 수확, description_ko: 양파를 수확한다, video: null, audio_url: null, delivery_mode: TEXT_TTS, unsupported_reason: null, translations: [] }
                ambiguities:
                  - { field: location, message: "'저짝'은 현장에서 위치 확인이 필요합니다.", blocking: false, kind: LOCATION }
                risk_assessment: { level: LOW, reasons: [], schema_version: '1', contract_version: safety-policy-v1 }
                transcript: 농장주 확인용 transcript
                schema_version: '1'
                contract_version: structure-v1
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/v1/work-sessions/drafts/{draftId}/supplement:
    post:
      tags: [Owner]
      summary: Merge one owner audio supplement into a draft
      description: Raw audio is deleted immediately after STT. Text supplements are not accepted.
      security: [{ ownerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SupplementAudioRequest' }
            example: { audio: supplement.webm, expected_draft_revision: 0, language_hint: ko }
      responses:
        '200':
          description: Updated draft.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkDraft' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/work-sessions/drafts/{draftId}/confirm:
    post:
      tags: [Owner]
      summary: Confirm initial draft and atomically publish immutable v1
      description: >-
        expected_version is always required and must be 0 for first publish.
        Non-blocking ambiguity or LOW-risk non-safety unsupported work may use
        PUBLISH_AS_IS with a reason. SUPPLEMENT must first merge owner audio.
        Safety ambiguity, HIGH or UNKNOWN risk, invalid
        schema, or no executable step returns OVERRIDE_NOT_ALLOWED.
      security: [{ ownerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftConfirmRequest' }
            examples:
              clear:
                value: { expected_version: 0, decision: CONFIRM }
              as_is:
                value:
                  expected_version: 0
                  decision: PUBLISH_AS_IS
                  ambiguity_override: true
                  override_reason: IN_PERSON_BRIEFING
      responses:
        '201':
          description: v1 published. Link creation is a separate delivery action.
          content: { application/json: { schema: { $ref: '#/components/schemas/OwnerWorkSession' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/v1/work-sessions:
    get:
      tags: [Owner]
      summary: List owner work sessions
      security: [{ ownerSession: [] }]
      responses:
        '200':
          description: Sessions.
          content: { application/json: { schema: { $ref: '#/components/schemas/OwnerWorkSessionList' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/work-sessions/{sessionId}:
    get:
      tags: [Owner]
      summary: Read owner work session and latest version
      security: [{ ownerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: Owner view, including transcript audit field.
          content: { application/json: { schema: { $ref: '#/components/schemas/OwnerWorkSession' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/work-sessions/{sessionId}/quantity-changes/from-audio:
    post:
      tags: [Owner]
      summary: Synchronously parse a quantity-change utterance without storing it
      description: Requires owner cookie. Same audio limit and prompt-injection boundary as draft audio. A READY result is a transient preview and is not stored.
      security: [{ ownerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, expected_version]
              properties:
                audio: { type: string, format: binary, description: audio/webm or audio/mp4; max 10 MiB and 60 seconds. }
                expected_version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Parsed but not stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuantityChangeParseResult' }
              examples:
                ready:
                  value: { interpretation: READY, quantity: { value: 15, unit: 망 }, expected_version: 1, ambiguities: [], schema_version: '1', contract_version: quantity-change-v1 }
                ambiguous:
                  value: { interpretation: AMBIGUOUS, quantity: null, expected_version: 1, ambiguities: [{ field: quantity, message: 수량을 다시 말해주세요., blocking: true, kind: QUANTITY }], schema_version: '1', contract_version: quantity-change-v1 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/v1/work-sessions/{sessionId}/quantity-changes/confirm:
    post:
      tags: [Owner]
      summary: Directly confirm a parsed quantity and publish the next immutable version
      description: quantity, expected_version, and Idempotency-Key are required. No proposal record is created. Version mismatch returns VERSION_CONFLICT.
      security: [{ ownerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuantityChangeConfirmRequest' }
            example: { quantity: { value: 15, unit: 망 }, expected_version: 1 }
      responses:
        '201':
          description: New version published; old version superseded.
          content: { application/json: { schema: { $ref: '#/components/schemas/OwnerWorkSession' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/v1/work-sessions/{sessionId}/worker-links:
    post:
      tags: [Owner]
      summary: Create or reissue one anonymous 24-hour link for a language
      security: [{ ownerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerLinkIssueRequest' }
            example: { language_code: vi }
      responses:
        '201':
          description: A new raw URL is returned once; a prior active link for this language is revoked.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkerLinkIssueResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/worker-links/{token}/assignment:
    get:
      tags: [Worker]
      summary: Resolve latest published assignment through 24h token
      description: >-
        No owner cookie. Every valid request resolves latest PUBLISHED version,
        never a pinned version. Worker response excludes transcript, raw audio,
        token hash, and owner-only risk assessment. Step translations are the
        canonical segment provenance; ambiguity and safety badges are typed.
        Every worker-visible string is already localized to language_code;
        clients must never fall back to owner-only Korean fields.
      security: []
      parameters: [{ $ref: '#/components/parameters/WorkerToken' }]
      responses:
        '200':
          description: Latest assignment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerAssignment' }
              example:
                language_code: vi
                session_id: ws_1
                version: 2
                lifecycle: PUBLISHED
                context:
                  location_display: Khu vực chủ trang trại chỉ định · cần xác nhận tại chỗ
                  quantity_display: 15 bao
                  deadline_display: Trước 11 giờ sáng
                  safety: []
                  notes: null
                steps:
                  - sequence: 1
                    task_code: ONION_HARVEST
                    title: Thu hoạch hành tây
                    description: Nhổ hành tây nhẹ nhàng để không làm dập củ.
                    video: null
                    audio_url: null
                    delivery_mode: TEXT_TTS
                    unsupported_reason: null
                    segments: []
                badge_codes: [NEEDS_CONFIRMATION]
        '404': { $ref: '#/components/responses/AccessDenied' }
        '410':
          description: Expired token; issue a new link.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: LINK_EXPIRED, message: 접근할 수 없습니다. 링크를 다시 발급받으세요. } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/v1/work-teams/today:
    post:
      tags: [Owner]
      summary: Create or return today's temporary work team and QR join URL
      security: [{ ownerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201': { description: Today's active team., content: { application/json: { schema: { $ref: '#/components/schemas/TodayWorkTeam' } } } }
        '200': { description: Existing active team for today's Asia/Seoul work date., content: { application/json: { schema: { $ref: '#/components/schemas/TodayWorkTeam' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
    get:
      tags: [Owner]
      summary: Read today's active team and joined members
      security: [{ ownerSession: [] }]
      responses:
        '200': { description: Today's active team. Members are ordered by joined_at ascending., content: { application/json: { schema: { $ref: '#/components/schemas/TodayWorkTeam' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/work-team-invites/{token}/join:
    post:
      tags: [Worker]
      summary: Join today's work team without creating an account
      description: Repeating the same request with the same Idempotency-Key returns the same member and never creates a duplicate row.
      security: []
      parameters:
        - $ref: '#/components/parameters/TeamInviteToken'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JoinTeamRequest' }
            example: { display_name: Nguyen, nationality_code: VN, language_code: vi }
      responses:
        '201': { description: Temporary team member created., content: { application/json: { schema: { $ref: '#/components/schemas/TeamMember' } } } }
        '404': { $ref: '#/components/responses/AccessDenied' }
        '410': { description: Invite expired., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/brief:
    get:
      tags: [Owner]
      summary: Render latest group briefing
      security: [{ ownerSession: [] }]
      parameters:
        - in: query
          name: session_id
          required: true
          schema: { type: string }
        - in: query
          name: language_code
          required: true
          schema: { type: string, enum: [vi, ne, km] }
      responses:
        '200':
          description: Latest briefing data.
          content: { application/json: { schema: { $ref: '#/components/schemas/Briefing' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
  /health:
    get:
      tags: [System]
      security: []
      responses:
        '200': { description: Process is alive., content: { application/json: { schema: { $ref: '#/components/schemas/Health' }, example: { status: ok } } } }
  /ready:
    get:
      tags: [System]
      security: []
      responses:
        '200': { description: Dependencies ready., content: { application/json: { schema: { $ref: '#/components/schemas/Health' }, example: { status: ready } } } }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
components:
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: batmeori_owner_session
  parameters:
    DraftId: { in: path, name: draftId, required: true, schema: { type: string } }
    SessionId: { in: path, name: sessionId, required: true, schema: { type: string } }
    WorkerToken: { in: path, name: token, required: true, schema: { type: string, minLength: 32 } }
    TeamInviteToken: { in: path, name: token, required: true, schema: { type: string, minLength: 32 } }
    IdempotencyKey: { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8 } }
  responses:
    Unauthorized: { description: Owner authentication required., content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: UNAUTHORIZED, message: 인증이 필요합니다. } } } }
    NotFound: { description: Resource not found., content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: NOT_FOUND, message: 찾을 수 없습니다. } } } }
    AccessDenied: { description: Generalized invalid-link response., content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: ACCESS_DENIED, message: 접근할 수 없습니다. } } } }
    VersionConflict: { description: Expected version mismatch., content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: VERSION_CONFLICT, message: 최신 작업 버전을 다시 확인하세요. } } } }
    Unprocessable: { description: Schema or safety gate rejected request., content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, examples: { invalid: { value: { code: SCHEMA_INVALID, message: 입력 형식이 올바르지 않습니다. } }, blocked: { value: { code: OVERRIDE_NOT_ALLOWED, message: 안전상 이 모호함은 그대로 전달할 수 없습니다. } } } } } }
    ServerError: { description: Unexpected server error., content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: INTERNAL_ERROR, message: 일시적인 오류입니다. } } } }
    ProviderUnavailable: { description: AI/provider or dependency unavailable., content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: PROVIDER_UNAVAILABLE, message: 잠시 후 다시 시도하세요. } } } }
    TooManyRequests: { description: Rate limited., content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: RATE_LIMITED, message: 잠시 후 다시 시도하세요. } } } }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [UNAUTHORIZED, NOT_FOUND, ACCESS_DENIED, LINK_EXPIRED, VERSION_CONFLICT, OVERRIDE_NOT_ALLOWED, SCHEMA_INVALID, PROVIDER_UNAVAILABLE, RATE_LIMITED, INTERNAL_ERROR] }
        message: { type: string }
        request_id: { type: string, description: Redacted correlation ID safe to show to the caller. }
        details: { type: object, additionalProperties: true }
    OwnerSession:
      type: object
      required: [authenticated, expires_at]
      properties: { authenticated: { type: boolean, const: true }, expires_at: { type: string, format: date-time } }
    NationalityCode:
      type: string
      enum: [VN, PH, LA, KH, TH, NP, MM, MN]
    TeamMember:
      type: object
      additionalProperties: false
      required: [member_id, display_name, nationality_code, language_code, joined_at]
      properties:
        member_id: { type: string }
        display_name: { type: string, minLength: 1, maxLength: 30 }
        display_name_ko: { type: [string, 'null'], minLength: 1, maxLength: 30, description: Optional Korean transliteration for owner-facing UI. The original display_name remains authoritative. }
        nationality_code: { $ref: '#/components/schemas/NationalityCode' }
        language_code: { type: string, enum: [vi, ne, km] }
        joined_at: { type: string, format: date-time }
    TodayWorkTeam:
      type: object
      additionalProperties: false
      required: [team_id, work_date, status, join_url, expires_at, members]
      properties:
        team_id: { type: string }
        work_date: { type: string, format: date, description: Work date calculated in Asia/Seoul. }
        status: { type: string, const: ACTIVE }
        join_url: { type: string, format: uri, description: Owner-authenticated invite URL. The client renders the QR; the API does not return image data. }
        expires_at: { type: string, format: date-time, description: Earlier of 24 hours after issue and the end of work_date in Asia/Seoul, serialized in UTC. }
        members: { type: array, items: { $ref: '#/components/schemas/TeamMember' } }
      example:
        team_id: team_01
        work_date: '2026-09-03'
        status: ACTIVE
        join_url: https://app.example.invalid/team/example-token-at-least-32-characters
        expires_at: '2026-09-03T15:00:00Z'
        members:
          - { member_id: member_01, display_name: Nguyen, nationality_code: VN, language_code: vi, joined_at: '2026-09-03T00:10:00Z' }
    JoinTeamRequest:
      type: object
      additionalProperties: false
      required: [display_name, nationality_code, language_code]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 30, description: Trimmed nickname or display name; not an account identifier. }
        nationality_code: { $ref: '#/components/schemas/NationalityCode' }
        language_code: { type: string, enum: [vi, ne, km] }
    Quantity:
      type: object
      required: [value, unit]
      properties:
        value: { type: integer, minimum: 1 }
        unit: { type: string, minLength: 1 }
    DeicticLocation:
      type: object
      required: [raw_text, kind, canonical_name]
      properties:
        raw_text: { type: [string, 'null'] }
        kind: { type: string, enum: [DEICTIC, NAMED, UNSPECIFIED] }
        canonical_name: { type: [string, 'null'] }
    Ambiguity:
      type: object
      required: [field, message, blocking, kind]
      properties:
        field: { type: string }
        message: { type: string }
        blocking: { type: boolean }
        kind: { type: string, enum: [SAFETY, TASK, LOCATION, QUANTITY, TIME, OTHER] }
    Step:
      type: object
      required: [sequence, task_code, title_ko, description_ko, video, audio_url, delivery_mode, unsupported_reason, translations]
      properties:
        sequence: { type: integer, minimum: 1 }
        task_code:
          anyOf:
            - { type: string, enum: [ONION_HARVEST, ONION_TRIMMING, ONION_SORTING, ONION_TRANSPORT, STRAWBERRY_HARVEST, STRAWBERRY_SORTING, STRAWBERRY_INSPECTION, STRAWBERRY_PACKING] }
            - { type: 'null' }
          description: null is only for an owner-overridden non-safety unsupported step.
        title_ko: { type: string }
        description_ko: { type: string }
        video: { anyOf: [{ $ref: '#/components/schemas/VideoAsset' }, { type: 'null' }] }
        audio_url: { type: [string, 'null'], format: uri }
        delivery_mode: { type: string, enum: [VIDEO, TEXT_TTS, TEXT] }
        unsupported_reason: { type: [string, 'null'] }
        translations: { type: array, items: { $ref: '#/components/schemas/SegmentTranslation' } }
      allOf:
        - if: { properties: { task_code: { type: 'null' } }, required: [task_code] }
          then:
            properties:
              unsupported_reason: { type: string, minLength: 1 }
              delivery_mode: { type: string, enum: [TEXT_TTS, TEXT] }
              video: { type: 'null' }
          else: { properties: { unsupported_reason: { type: 'null' } } }
    VideoAsset:
      type: object
      required: [asset_id, task_code, video_url, provenance, review_status, safety_level, captions_text]
      properties:
        asset_id: { type: string }
        task_code: { type: string, enum: [ONION_HARVEST, ONION_TRIMMING, ONION_SORTING, ONION_TRANSPORT, STRAWBERRY_HARVEST, STRAWBERRY_SORTING, STRAWBERRY_INSPECTION, STRAWBERRY_PACKING] }
        video_url: { type: string, format: uri-reference, description: P0 uses a FE public/videos static path. }
        provenance: { type: string, const: AI_GENERATED_PREGENERATED }
        review_status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        safety_level: { type: string, enum: [LOW, HIGH] }
        captions_text: { type: string }
    SegmentTranslation:
      type: object
      required: [segment, language_code, text, source, verified, guide_lookup, phrase_key, source_page, source_url, license]
      properties:
        segment: { type: string, enum: [ACTION, QUANTITY, ORDER, SAFETY, LOCATION, OTHER] }
        language_code: { type: string, enum: [vi, ne, km] }
        text: { type: string }
        source: { type: string, enum: [OFFICIAL_GUIDE, AI_TRANSLATION, DETERMINISTIC] }
        verified: { type: boolean }
        guide_lookup: { type: string, enum: [HIT, MISS, NOT_APPLICABLE] }
        phrase_key: { type: [string, 'null'] }
        source_page: { type: [integer, 'null'] }
        source_url: { type: [string, 'null'] }
        license: { type: [string, 'null'] }
      oneOf:
        - properties: { source: { const: OFFICIAL_GUIDE }, guide_lookup: { const: HIT }, phrase_key: { type: string, minLength: 1 }, verified: { const: true }, source_page: { type: integer, minimum: 1 }, source_url: { type: string, format: uri }, license: { type: string, minLength: 1 } }
        - properties: { source: { const: AI_TRANSLATION }, guide_lookup: { const: MISS }, phrase_key: { type: 'null' }, verified: { const: false }, source_page: { type: 'null' }, source_url: { type: 'null' }, license: { type: 'null' } }
        - properties: { source: { const: DETERMINISTIC }, guide_lookup: { const: NOT_APPLICABLE }, phrase_key: { type: 'null' }, verified: { const: false }, source_page: { type: 'null' }, source_url: { type: 'null' }, license: { type: 'null' } }
      allOf:
        - if: { properties: { segment: { const: SAFETY } }, required: [segment] }
          then: { properties: { source: { const: OFFICIAL_GUIDE }, guide_lookup: { const: HIT }, verified: { const: true } } }
    DraftState:
      type: object
      required: [task_family, location, location_display, quantity, deadline, safety, notes, steps]
      properties:
        task_family: { type: string, enum: [ONION, STRAWBERRY] }
        location: { $ref: '#/components/schemas/DeicticLocation' }
        location_display: { type: string, description: Worker-visible text; DEICTIC keeps raw location and asks for on-site confirmation. }
        quantity: { anyOf: [{ $ref: '#/components/schemas/Quantity' }, { type: string, const: UNSPECIFIED }, { type: 'null' }] }
        deadline: { type: [string, 'null'] }
        safety: { type: array, items: { type: string } }
        notes: { type: [string, 'null'] }
        steps: { type: array, minItems: 0, items: { $ref: '#/components/schemas/Step' } }
      allOf:
        - if: { properties: { task_family: { const: ONION } }, required: [task_family] }
          then:
            properties:
              steps:
                items:
                  properties:
                    task_code:
                      anyOf:
                        - { type: string, enum: [ONION_HARVEST, ONION_TRIMMING, ONION_SORTING, ONION_TRANSPORT] }
                        - { type: 'null' }
        - if: { properties: { task_family: { const: STRAWBERRY } }, required: [task_family] }
          then:
            properties:
              steps:
                items:
                  properties:
                    task_code:
                      anyOf:
                        - { type: string, enum: [STRAWBERRY_HARVEST, STRAWBERRY_SORTING, STRAWBERRY_INSPECTION, STRAWBERRY_PACKING] }
                        - { type: 'null' }
    PublishedWorkState:
      type: object
      required: [task_family, location, location_display, quantity, deadline, safety, notes, steps]
      properties:
        task_family: { type: string, enum: [ONION, STRAWBERRY] }
        location: { $ref: '#/components/schemas/DeicticLocation' }
        location_display: { type: string, description: Worker-visible text; DEICTIC keeps raw location and asks for on-site confirmation. }
        quantity: { anyOf: [{ $ref: '#/components/schemas/Quantity' }, { type: string, const: UNSPECIFIED }, { type: 'null' }] }
        deadline: { type: [string, 'null'] }
        safety: { type: array, items: { type: string } }
        notes: { type: [string, 'null'] }
        steps: { type: array, minItems: 1, items: { $ref: '#/components/schemas/Step' } }
      allOf:
        - if: { properties: { task_family: { const: ONION } }, required: [task_family] }
          then:
            properties:
              steps:
                items:
                  properties:
                    task_code:
                      anyOf:
                        - { type: string, enum: [ONION_HARVEST, ONION_TRIMMING, ONION_SORTING, ONION_TRANSPORT] }
                        - { type: 'null' }
        - if: { properties: { task_family: { const: STRAWBERRY } }, required: [task_family] }
          then:
            properties:
              steps:
                items:
                  properties:
                    task_code:
                      anyOf:
                        - { type: string, enum: [STRAWBERRY_HARVEST, STRAWBERRY_SORTING, STRAWBERRY_INSPECTION, STRAWBERRY_PACKING] }
                        - { type: 'null' }
    WorkDraft:
      type: object
      required: [draft_id, draft_revision, summary_ko, interpretation, state, ambiguities, risk_assessment, transcript, schema_version, contract_version]
      properties:
        draft_id: { type: string }
        draft_revision: { type: integer, minimum: 0 }
        summary_ko: { type: string, minLength: 1, description: Owner-only Korean confirmation summary. }
        interpretation: { type: string, enum: [READY, AMBIGUOUS, UNSUPPORTED] }
        state: { $ref: '#/components/schemas/DraftState' }
        ambiguities: { type: array, items: { $ref: '#/components/schemas/Ambiguity' } }
        risk_assessment: { $ref: '#/components/schemas/RiskAssessment' }
        transcript: { type: string, description: Owner-only audit field; never returned to workers. }
        schema_version: { type: string, const: '1' }
        contract_version: { type: string, const: structure-v1 }
    DraftConfirmRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [expected_version, decision]
          properties:
            expected_version: { type: integer, const: 0 }
            decision: { type: string, const: CONFIRM }
        - type: object
          additionalProperties: false
          required: [expected_version, decision, ambiguity_override, override_reason]
          properties:
            expected_version: { type: integer, const: 0 }
            decision: { type: string, const: PUBLISH_AS_IS }
            ambiguity_override: { type: boolean, const: true }
            override_reason: { type: string, enum: [EXPERIENCED_WORKER, IN_PERSON_BRIEFING, OWNER_ACCEPTED_OTHER] }
    SupplementAudioRequest:
      type: object
      additionalProperties: false
      required: [audio, expected_draft_revision]
      properties:
        audio: { type: string, format: binary, description: audio/webm or audio/mp4; max 10 MiB and 60 seconds. }
        expected_draft_revision: { type: integer, minimum: 0 }
        language_hint: { type: string, enum: [ko] }
    RiskAssessment:
      type: object
      additionalProperties: false
      required: [level, reasons, schema_version, contract_version]
      properties:
        level: { type: string, enum: [LOW, HIGH, UNKNOWN] }
        reasons:
          type: array
          uniqueItems: true
          items: { type: string, enum: [VEHICLE_OPERATION, ROTATING_BLADE, PESTICIDE_OR_CHEMICAL, WORK_AT_HEIGHT, POWERED_MACHINERY, INSUFFICIENT_CONTEXT, OTHER_HIGH_RISK] }
        schema_version: { type: string, const: '1' }
        contract_version: { type: string, const: safety-policy-v1 }
      oneOf:
        - properties: { level: { const: LOW }, reasons: { maxItems: 0 } }
        - properties: { level: { enum: [HIGH, UNKNOWN] }, reasons: { minItems: 1 } }
    QuantityChangeParseResult:
      type: object
      required: [interpretation, quantity, expected_version, ambiguities, schema_version, contract_version]
      properties:
        interpretation: { type: string, enum: [READY, AMBIGUOUS] }
        quantity: { anyOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }] }
        expected_version: { type: integer, minimum: 1 }
        ambiguities: { type: array, items: { $ref: '#/components/schemas/Ambiguity' } }
        schema_version: { type: string, const: '1' }
        contract_version: { type: string, const: quantity-change-v1 }
    QuantityChangeConfirmRequest:
      type: object
      required: [quantity, expected_version]
      properties:
        quantity: { $ref: '#/components/schemas/Quantity' }
        expected_version: { type: integer, minimum: 1 }
    WorkVersion:
      type: object
      required: [version, lifecycle, state, risk_assessment]
      properties:
        version: { type: integer, minimum: 1 }
        lifecycle: { type: string, enum: [PUBLISHED, SUPERSEDED] }
        state: { $ref: '#/components/schemas/PublishedWorkState' }
        risk_assessment: { $ref: '#/components/schemas/RiskAssessment' }
        ambiguity_override: { type: boolean }
        override_reason: { type: [string, 'null'], enum: [EXPERIENCED_WORKER, IN_PERSON_BRIEFING, OWNER_ACCEPTED_OTHER, null] }
        overridden_at: { type: [string, 'null'], format: date-time }
        transcript: { type: string, description: Owner-only audit field. }
    OwnerWorkSession:
      type: object
      required: [session_id, current_version, lifecycle, version]
      properties:
        session_id: { type: string }
        current_version: { type: integer, minimum: 1 }
        lifecycle: { type: string, const: PUBLISHED }
        version: { $ref: '#/components/schemas/WorkVersion' }
    IssuedWorkerLink:
      type: object
      required: [language_code, url, expires_at]
      properties:
        language_code: { type: string, enum: [vi, ne, km] }
        url: { type: string, format: uri, description: Returned only when issued; never persisted or returned by regular reads. }
        expires_at: { type: string, format: date-time }
    WorkerLinkIssueResponse:
      type: object
      required: [session_id, issued_worker_link]
      properties:
        session_id: { type: string }
        issued_worker_link: { $ref: '#/components/schemas/IssuedWorkerLink' }
    WorkerLinkIssueRequest:
      type: object
      additionalProperties: false
      required: [language_code]
      properties:
        language_code: { type: string, enum: [vi, ne, km] }
    OwnerWorkSessionList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/OwnerWorkSession' } } }
    LocalizedWorkerContext:
      type: object
      additionalProperties: false
      required: [location_display, quantity_display, deadline_display, safety, notes]
      properties:
        location_display: { type: string, minLength: 1 }
        quantity_display: { type: string, minLength: 1 }
        deadline_display: { type: [string, 'null'] }
        safety: { type: array, items: { type: string, minLength: 1 } }
        notes: { type: [string, 'null'] }
    WorkerStep:
      type: object
      additionalProperties: false
      required: [sequence, task_code, title, description, video, audio_url, delivery_mode, unsupported_reason, segments]
      properties:
        sequence: { type: integer, minimum: 1 }
        task_code:
          anyOf:
            - { type: string, enum: [ONION_HARVEST, ONION_TRIMMING, ONION_SORTING, ONION_TRANSPORT, STRAWBERRY_HARVEST, STRAWBERRY_SORTING, STRAWBERRY_INSPECTION, STRAWBERRY_PACKING] }
            - { type: 'null' }
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        video: { anyOf: [{ $ref: '#/components/schemas/VideoAsset' }, { type: 'null' }] }
        audio_url: { type: [string, 'null'], format: uri }
        delivery_mode: { type: string, enum: [VIDEO, TEXT_TTS, TEXT] }
        unsupported_reason: { type: [string, 'null'] }
        segments:
          type: array
          items: { $ref: '#/components/schemas/SegmentTranslation' }
          description: Contains only the response language and retains segment-level provenance.
    WorkerAssignment:
      type: object
      required: [language_code, session_id, version, lifecycle, context, steps, badge_codes]
      properties:
        language_code: { type: string, enum: [vi, ne, km] }
        session_id: { type: string }
        version: { type: integer, minimum: 1 }
        lifecycle: { type: string, const: PUBLISHED }
        context: { $ref: '#/components/schemas/LocalizedWorkerContext' }
        steps: { type: array, minItems: 1, items: { $ref: '#/components/schemas/WorkerStep' } }
        badge_codes: { type: array, items: { type: string, enum: [NEEDS_CONFIRMATION, DEMO_FALLBACK] } }
    Briefing:
      type: object
      required: [session_id, version, language_code, context, steps, badge_codes]
      properties:
        session_id: { type: string }
        version: { type: integer, minimum: 1 }
        language_code: { type: string, enum: [vi, ne, km] }
        context: { $ref: '#/components/schemas/LocalizedWorkerContext' }
        steps: { type: array, minItems: 1, items: { $ref: '#/components/schemas/WorkerStep' } }
        badge_codes: { type: array, items: { type: string, enum: [NEEDS_CONFIRMATION, DEMO_FALLBACK] } }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready] }
        request_id: { type: string }
