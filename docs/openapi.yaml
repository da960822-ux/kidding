openapi: 3.1.0
info:
  title: Batmeori API
  version: 2.0.0
  description: >-
    Provider-neutral P0 REST contract. New P0 publishes use structure-v2 and
    ontology-v2 for onion and strawberry, vi/ne, quantity changes, CO_PRESENT
    owner briefing, REMOTE anonymous language links, and an anonymous today-team
    QR roster for person-specific, multiple assignments.
servers:
  - url: https://api.example.invalid
    description: Deployment value is supplied by environment; this URL is not a source fact.
tags:
  - name: Owner
  - name: Worker
  - name: Team
  - name: System
paths:
  /api/v1/owner/session:
    post:
      tags: [Owner]
      summary: Issue short demo PIN session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PinLoginRequest' }
            example: { pin: '1234' }
      responses:
        '201':
          description: Session issued.
          headers:
            Set-Cookie:
              schema: { type: string }
              description: HttpOnly; Secure; SameSite=None cookie. Owner mutations use exact Origin validation as P0 CSRF defense; no separate CSRF header.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/work-sessions/drafts/from-audio:
    post:
      tags: [Owner]
      summary: Synchronously transcribe, structure, translate, and match video
      description: >-
        Requires owner cookie. Raw audio is temporary during STT and deleted
        immediately on success or failure. No version is created.
      security: [{ ownerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio]
              properties:
                audio:
                  type: string
                  format: binary
                  description: audio/webm, audio/mp4, or audio/wav; max 10 MiB and 60 seconds.
                language_hint: { type: string, enum: [ko], default: ko }
      responses:
        '200':
          description: structure-v2 draft generated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkDraft' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/ServerError' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/v1/work-sessions/drafts/{draftId}/supplement:
    post:
      tags: [Owner]
      summary: Merge one owner audio supplement into a draft
      security: [{ ownerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, expected_draft_revision]
              properties:
                audio: { type: string, format: binary, description: audio/webm, audio/mp4, or audio/wav; max 10 MiB and 60 seconds. }
                expected_draft_revision: { type: integer, minimum: 0 }
                language_hint: { type: string, enum: [ko], default: ko }
      responses:
        '200':
          description: structure-v2 draft updated.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkDraft' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/work-sessions/drafts/{draftId}/confirm:
    post:
      tags: [Owner]
      summary: Confirm a structure-v2 draft and publish immutable v1
      description: >-
        New publish accepts only structure-v2/ontology-v2. Confirm creates no
        delivery mode, language, or raw link; CO_PRESENT and REMOTE are chosen
        after publish. Legacy v1 is read-only.
      security: [{ ownerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/DraftId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftConfirmRequest' }
            examples:
              clear:
                value: { expected_version: 0, decision: CONFIRM }
              as_is:
                value:
                  expected_version: 0
                  decision: PUBLISH_AS_IS
                  ambiguity_override: true
                  override_reason: IN_PERSON_BRIEFING
      responses:
        '201':
          description: structure-v2 immutable v1 published with vi/ne WorkerBriefing packages and no issued link.
          content: { application/json: { schema: { $ref: '#/components/schemas/InitialPublishResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/v1/work-sessions:
    get:
      tags: [Owner]
      summary: List owner work sessions
      security: [{ ownerSession: [] }]
      responses:
        '200':
          description: Sessions.
          content: { application/json: { schema: { $ref: '#/components/schemas/OwnerWorkSessionList' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/v1/work-sessions/{sessionId}:
    get:
      tags: [Owner]
      summary: Read owner work session and latest version
      security: [{ ownerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/SessionId' }]
      responses:
        '200':
          description: Owner v2 view or separately marked legacy read-only view.
          content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/OwnerWorkSession' }, { $ref: '#/components/schemas/LegacyWorkSessionRead' }] } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/work-sessions/{sessionId}/quantity-changes/from-audio:
    post:
      tags: [Owner]
      summary: Parse quantity-change audio without storing it
      description: Parses a v2 PUBLISHED WorkSession without storing audio. Legacy v1 returns 422 LEGACY_READ_ONLY.
      security: [{ ownerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [audio, expected_version]
              properties:
                audio: { type: string, format: binary, description: audio/webm, audio/mp4, or audio/wav; max 10 MiB and 60 seconds. }
                expected_version: { type: integer, minimum: 1 }
      responses:
        '200':
          description: Parsed but not stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/QuantityChangeParseResult' }
              examples:
                ready:
                  value: { interpretation: READY, quantity: { value: 15, unit: 망 }, expected_version: 1, ambiguities: [], schema_version: '1', contract_version: quantity-change-v1 }
                ambiguous:
                  value: { interpretation: AMBIGUOUS, quantity: null, expected_version: 1, ambiguities: [{ field: quantity, message: 수량을 다시 말해주세요., blocking: true, kind: QUANTITY }], schema_version: '1', contract_version: quantity-change-v1 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
  /api/v1/work-sessions/{sessionId}/quantity-changes/confirm:
    post:
      tags: [Owner]
      summary: Confirm quantity and publish the next immutable version
      description: Regenerates a complete structure-v2 WorkVersion and both vi/ne WorkerBriefing packages atomically. Legacy v1 returns 422 LEGACY_READ_ONLY.
      security: [{ ownerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuantityChangeConfirmRequest' }
            example: { quantity: { value: 15, unit: 망 }, expected_version: 1 }
      responses:
        '201':
          description: New version published; old version superseded.
          content: { application/json: { schema: { $ref: '#/components/schemas/OwnerWorkSession' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/v1/work-sessions/{sessionId}/worker-links:
    post:
      tags: [Owner]
      summary: Create or reissue one anonymous 24-hour language link
      security: [{ ownerSession: [] }]
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkerLinkIssueRequest' }
            example: { language_code: vi }
      responses:
        '201':
          description: Raw URL returned once.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkerLinkIssueResponse' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/VersionConflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/worker-links/{token}/assignment:
    get:
      tags: [Worker]
      summary: Resolve latest published assignment through an anonymous language link
      description: >-
        Resolves the latest stored WorkerBriefing v2. Worker responses exclude
        transcript, raw audio, risk assessment, token hash, and owner audit fields.
      security: []
      parameters: [{ $ref: '#/components/parameters/WorkerToken' }]
      responses:
        '200':
          description: Latest stored WorkerBriefing v2.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkerBriefing' }
              example:
                language_code: vi
                session_id: ws_1
                version: 2
                lifecycle: PUBLISHED
                state:
                  task_family: ONION
                  location: { raw_text: 저짝, kind: DEICTIC, canonical_name: null }
                  quantity: { value: 15, unit: 망 }
                  location_display: 농장주가 가리킨 장소 · 현장 확인 필요
                  deadline: null
                  safety: []
                  notes: null
                  steps: [{ sequence: 1, task_code: ONION_HARVEST, title_ko: 양파 수확, description_ko: 양파를 수확한다, video: null, audio_url: null, delivery_mode: TEXT_TTS, unsupported_reason: null, translations: [] }]
                badges: [확인이 필요한 지시]
        '404': { $ref: '#/components/responses/AccessDenied' }
        '410':
          description: Expired token; issue a new link.
          content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: LINK_EXPIRED, message: 접근할 수 없습니다. 링크를 다시 발급받으세요. } } }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/v1/brief:
    get:
      tags: [Owner]
      summary: Render latest CO_PRESENT group briefing
      security: [{ ownerSession: [] }]
      parameters:
        - in: query
          name: session_id
          required: true
          schema: { type: string }
        - in: query
          name: language_code
          required: true
          schema: { type: string, enum: [vi, ne] }
      responses:
        '200':
          description: Latest stored WorkerBriefing v2.
          content: { application/json: { schema: { $ref: '#/components/schemas/WorkerBriefing' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
  /api/v1/work-teams/today:
    post:
      tags: [Owner, Team]
      summary: Create or rotate today's anonymous QR invite
      description: Creates the Asia/Seoul work-date team when absent. Each POST returns a new raw QR URL and invalidates the prior QR; the raw token is never stored.
      security: [{ ownerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '200': { description: Existing team with a newly issued QR., content: { application/json: { schema: { $ref: '#/components/schemas/TodayWorkTeam' } } } }
        '201': { description: New team with QR., content: { application/json: { schema: { $ref: '#/components/schemas/TodayWorkTeam' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    get:
      tags: [Owner, Team]
      summary: Read today's temporary roster
      security: [{ ownerSession: [] }]
      responses:
        '200': { description: Today's roster. join_url is null until the owner issues a fresh QR., content: { application/json: { schema: { $ref: '#/components/schemas/TodayWorkTeam' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/work-team-invites/{token}/join:
    post:
      tags: [Worker, Team]
      summary: Join today's team without an account
      description: Accepts only a temporary display name and vi/ne. It sets an HttpOnly member cookie scoped to the temporary team.
      security: []
      parameters: [{ $ref: '#/components/parameters/TeamInviteToken' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/JoinTeamRequest' } } }
      responses:
        '201': { description: Temporary member joined., headers: { Set-Cookie: { schema: { type: string } } }, content: { application/json: { schema: { $ref: '#/components/schemas/TeamMember' } } } }
        '404': { $ref: '#/components/responses/AccessDenied' }
        '410': { description: Invite expired., content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /api/v1/work-teams/today/members/{memberId}/assignments:
    post:
      tags: [Owner, Team]
      summary: Assign a published WorkSession to a temporary team member
      security: [{ ownerSession: [] }]
      parameters: [{ $ref: '#/components/parameters/TeamMemberId' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TeamAssignmentRequest' } } }
      responses:
        '201': { description: Assignment active., content: { application/json: { schema: { $ref: '#/components/schemas/TeamAssignmentMeta' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /api/v1/work-team-members/me/assignments:
    get:
      tags: [Worker, Team]
      summary: Read this browser's assigned latest work states
      security: [{ teamMemberSession: [] }]
      responses:
        '200': { description: Latest states; an empty array means waiting for owner assignment., content: { application/json: { schema: { $ref: '#/components/schemas/TeamAssignmentsResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /health:
    get:
      tags: [System]
      security: []
      responses:
        '200': { description: Process is alive., content: { application/json: { schema: { $ref: '#/components/schemas/Health' }, example: { status: ok } } } }
  /ready:
    get:
      tags: [System]
      security: []
      responses:
        '200': { description: Dependencies ready., content: { application/json: { schema: { $ref: '#/components/schemas/Health' }, example: { status: ready } } } }
        '503': { $ref: '#/components/responses/ProviderUnavailable' }
components:
  securitySchemes:
    ownerSession:
      type: apiKey
      in: cookie
      name: batmeori_owner_session
    teamMemberSession:
      type: apiKey
      in: cookie
      name: batmeori_team_member
  parameters:
    DraftId: { in: path, name: draftId, required: true, schema: { type: string } }
    SessionId: { in: path, name: sessionId, required: true, schema: { type: string } }
    WorkerToken: { in: path, name: token, required: true, schema: { type: string, minLength: 32 } }
    TeamInviteToken: { in: path, name: token, required: true, schema: { type: string, minLength: 32 } }
    TeamMemberId: { in: path, name: memberId, required: true, schema: { type: string, format: uuid } }
    IdempotencyKey: { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8 } }
  responses:
    Unauthorized: { description: Owner authentication required., content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: UNAUTHORIZED, message: 인증이 필요합니다. } } } }
    NotFound: { description: Resource not found., content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: NOT_FOUND, message: 찾을 수 없습니다. } } } }
    AccessDenied: { description: Generalized invalid-link response., content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: ACCESS_DENIED, message: 접근할 수 없습니다. } } } }
    VersionConflict: { description: Expected version mismatch., content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: VERSION_CONFLICT, message: 최신 작업 버전을 다시 확인하세요. } } } }
    Unprocessable: { description: Schema or safety gate rejected request., content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, examples: { invalid: { value: { code: SCHEMA_INVALID, message: 입력 형식이 올바르지 않습니다. } }, blocked: { value: { code: OVERRIDE_NOT_ALLOWED, message: 안전상 이 모호함은 그대로 전달할 수 없습니다. } } } } } }
    ServerError: { description: Unexpected server error., content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: INTERNAL_ERROR, message: 일시적인 오류입니다. } } } }
    ProviderUnavailable: { description: AI/provider or dependency unavailable., content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: PROVIDER_UNAVAILABLE, message: 잠시 후 다시 시도하세요. } } } }
    TooManyRequests: { description: Rate limited., content: { application/json: { schema: { $ref: '#/components/schemas/Error' }, example: { code: RATE_LIMITED, message: 잠시 후 다시 시도하세요. } } } }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, enum: [UNAUTHORIZED, NOT_FOUND, ACCESS_DENIED, LINK_EXPIRED, VERSION_CONFLICT, LEGACY_READ_ONLY, OVERRIDE_NOT_ALLOWED, SCHEMA_INVALID, PROVIDER_UNAVAILABLE, RATE_LIMITED, INTERNAL_ERROR] }
        message: { type: string }
        request_id: { type: string, description: Redacted correlation ID safe to show to the caller. }
        details: { type: object, additionalProperties: true }
    PinLoginRequest:
      type: object
      required: [pin]
      properties: { pin: { type: string, minLength: 4, maxLength: 32, writeOnly: true } }
    OwnerSession:
      type: object
      required: [authenticated, expires_at]
      properties: { authenticated: { type: boolean, const: true }, expires_at: { type: string, format: date-time } }
    TeamMember:
      type: object
      additionalProperties: false
      required: [member_id, display_name, language_code, joined_at, assignment_session_ids]
      properties:
        member_id: { type: string, format: uuid }
        display_name: { type: string, minLength: 1, maxLength: 30 }
        language_code: { type: string, enum: [vi, ne] }
        joined_at: { type: string, format: date-time }
        assignment_session_ids: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
    TodayWorkTeam:
      type: object
      additionalProperties: false
      required: [team_id, work_date, status, join_url, expires_at, members]
      properties:
        team_id: { type: string, format: uuid }
        work_date: { type: string, format: date, description: Asia/Seoul work date. }
        status: { type: string, const: ACTIVE }
        join_url: { type: [string, 'null'], format: uri, description: Returned only by POST when a fresh QR is issued. }
        expires_at: { type: string, format: date-time }
        members: { type: array, items: { $ref: '#/components/schemas/TeamMember' } }
    JoinTeamRequest:
      type: object
      additionalProperties: false
      required: [display_name, language_code]
      properties:
        display_name: { type: string, minLength: 1, maxLength: 30, description: Trimmed display name or nickname; never an account ID. }
        language_code: { type: string, enum: [vi, ne] }
    TeamAssignmentRequest:
      type: object
      additionalProperties: false
      required: [work_session_id]
      properties: { work_session_id: { type: string, format: uuid } }
    TeamAssignmentMeta:
      type: object
      additionalProperties: false
      required: [member_id, work_session_id, assigned_at]
      properties:
        member_id: { type: string, format: uuid }
        work_session_id: { type: string, format: uuid }
        assigned_at: { type: string, format: date-time }
    TeamAssignmentsResponse:
      type: object
      additionalProperties: false
      required: [assignments]
      properties:
        assignments: { type: array, items: { $ref: '#/components/schemas/WorkerBriefing' } }
    Quantity:
      type: object
      required: [value, unit]
      properties:
        value: { type: integer, minimum: 1 }
        unit: { type: string, minLength: 1 }
    DeicticLocation:
      type: object
      required: [raw_text, kind, canonical_name]
      properties:
        raw_text: { type: [string, 'null'] }
        kind: { type: string, enum: [DEICTIC, NAMED, UNSPECIFIED] }
        canonical_name: { type: [string, 'null'] }
    Ambiguity:
      type: object
      required: [field, message, blocking, kind]
      properties:
        field: { type: string }
        message: { type: string }
        blocking: { type: boolean }
        kind: { type: string, enum: [SAFETY, TASK, LOCATION, QUANTITY, TIME, OTHER] }
    Step:
      type: object
      required: [sequence, task_code, title_ko, description_ko, video, audio_url, delivery_mode, unsupported_reason, translations]
      properties:
        sequence: { type: integer, minimum: 1 }
        task_code:
          anyOf:
            - { type: string, enum: [ONION_HARVEST, ONION_TRIMMING, ONION_SORTING, ONION_TRANSPORT, STRAWBERRY_HARVEST, STRAWBERRY_SORTING, STRAWBERRY_INSPECTION, STRAWBERRY_PACKING] }
            - { type: 'null' }
          description: null is only for an owner-overridden non-safety unsupported step.
        title_ko: { type: string }
        description_ko: { type: string }
        video: { anyOf: [{ $ref: '#/components/schemas/VideoAsset' }, { type: 'null' }] }
        audio_url: { type: [string, 'null'], format: uri }
        delivery_mode: { type: string, enum: [VIDEO, TEXT_TTS, TEXT] }
        unsupported_reason: { type: [string, 'null'] }
        translations: { type: array, items: { $ref: '#/components/schemas/SegmentTranslation' } }
      allOf:
        - if: { properties: { task_code: { type: 'null' } }, required: [task_code] }
          then:
            properties:
              unsupported_reason: { type: string, minLength: 1 }
              delivery_mode: { type: string, enum: [TEXT_TTS, TEXT] }
              video: { type: 'null' }
          else: { properties: { unsupported_reason: { type: 'null' } } }
    VideoAsset:
      type: object
      required: [asset_id, task_code, video_url, provenance, review_status, safety_level, captions_text]
      properties:
        asset_id: { type: string }
        task_code: { type: string }
        video_url: { type: string, format: uri-reference, description: P0 uses a FE public/videos static path. }
        provenance: { type: string, const: AI_GENERATED_PREGENERATED }
        review_status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        safety_level: { type: string, enum: [LOW, HIGH] }
        captions_text: { type: string }
    SegmentTranslation:
      type: object
      required: [segment, language_code, text, source, verified, guide_lookup, phrase_key, source_page, source_url, license]
      properties:
        segment: { type: string, enum: [ACTION, QUANTITY, ORDER, SAFETY, LOCATION, OTHER] }
        language_code: { type: string, enum: [vi, ne] }
        text: { type: string }
        source: { type: string, enum: [OFFICIAL_GUIDE, AI_TRANSLATION, DETERMINISTIC] }
        verified: { type: boolean }
        guide_lookup: { type: string, enum: [HIT, MISS, NOT_APPLICABLE] }
        phrase_key: { type: [string, 'null'] }
        source_page: { type: [integer, 'null'] }
        source_url: { type: [string, 'null'] }
        license: { type: [string, 'null'] }
      oneOf:
        - properties: { source: { const: OFFICIAL_GUIDE }, guide_lookup: { const: HIT }, phrase_key: { type: string, minLength: 1 }, verified: { const: true }, source_page: { type: integer, minimum: 1 }, source_url: { type: string, format: uri }, license: { type: string, minLength: 1 } }
        - properties: { source: { const: AI_TRANSLATION }, guide_lookup: { const: MISS }, phrase_key: { type: 'null' }, verified: { const: false }, source_page: { type: 'null' }, source_url: { type: 'null' }, license: { type: 'null' } }
        - properties: { source: { const: DETERMINISTIC }, guide_lookup: { const: NOT_APPLICABLE }, phrase_key: { type: 'null' }, verified: { const: false }, source_page: { type: 'null' }, source_url: { type: 'null' }, license: { type: 'null' } }
      allOf:
        - if: { properties: { segment: { const: SAFETY } }, required: [segment] }
          then: { properties: { source: { const: OFFICIAL_GUIDE }, guide_lookup: { const: HIT }, verified: { const: true } } }
    WorkState:
      type: object
      required: [task_family, location, location_display, quantity, deadline, safety, notes, steps, risk_assessment]
      properties:
        task_family: { type: string, enum: [ONION, STRAWBERRY] }
        location: { $ref: '#/components/schemas/DeicticLocation' }
        location_display: { type: string, description: Worker-visible text; DEICTIC keeps raw location and asks for on-site confirmation. }
        quantity: { anyOf: [{ $ref: '#/components/schemas/Quantity' }, { type: string, const: UNSPECIFIED }, { type: 'null' }] }
        deadline: { type: [string, 'null'] }
        safety: { type: array, items: { type: string } }
        notes: { type: [string, 'null'] }
        steps: { type: array, minItems: 0, items: { $ref: '#/components/schemas/Step' } }
        risk_assessment: { $ref: '#/components/schemas/RiskAssessment' }
    WorkerState:
      type: object
      required: [task_family, location, location_display, quantity, deadline, safety, notes, steps]
      properties:
        task_family: { type: string, enum: [ONION, STRAWBERRY] }
        location: { $ref: '#/components/schemas/DeicticLocation' }
        location_display: { type: string, description: Worker-visible text; DEICTIC keeps raw location and asks for on-site confirmation. }
        quantity: { anyOf: [{ $ref: '#/components/schemas/Quantity' }, { type: string, const: UNSPECIFIED }, { type: 'null' }] }
        deadline: { type: [string, 'null'] }
        safety: { type: array, items: { type: string } }
        notes: { type: [string, 'null'] }
        steps: { type: array, minItems: 0, items: { $ref: '#/components/schemas/Step' } }
    WorkDraft:
      type: object
      required: [draft_id, draft_revision, summary_ko, interpretation, state, ambiguities, transcript, schema_version, contract_version, ontology_version]
      properties:
        draft_id: { type: string }
        draft_revision: { type: integer, minimum: 0 }
        summary_ko: { type: string, minLength: 1 }
        interpretation: { type: string, enum: [READY, AMBIGUOUS, UNSUPPORTED] }
        state: { $ref: '#/components/schemas/StructureV2' }
        ambiguities: { type: array, items: { $ref: '#/components/schemas/Ambiguity' } }
        transcript: { type: string }
        schema_version: { type: string, const: '2' }
        contract_version: { type: string, const: structure-v2 }
        ontology_version: { type: string, const: ontology-v2 }
    DraftConfirmRequest:
      oneOf:
        - type: object
          additionalProperties: false
          required: [expected_version, decision]
          properties:
            expected_version: { type: integer, const: 0 }
            decision: { type: string, const: CONFIRM }
        - type: object
          additionalProperties: false
          required: [expected_version, decision, ambiguity_override, override_reason]
          properties:
            expected_version: { type: integer, const: 0 }
            decision: { type: string, const: PUBLISH_AS_IS }
            ambiguity_override: { type: boolean, const: true }
            override_reason: { type: string, enum: [EXPERIENCED_WORKER, IN_PERSON_BRIEFING, OWNER_ACCEPTED_OTHER] }
    RiskAssessment:
      type: object
      additionalProperties: false
      required: [level, reasons, schema_version, contract_version]
      properties:
        level: { type: string, enum: [LOW, HIGH, UNKNOWN] }
        reasons:
          type: array
          uniqueItems: true
          items: { type: string, enum: [VEHICLE_OPERATION, ROTATING_BLADE, PESTICIDE_OR_CHEMICAL, WORK_AT_HEIGHT, POWERED_MACHINERY, INSUFFICIENT_CONTEXT, OTHER_HIGH_RISK] }
        schema_version: { type: string, const: '1' }
        contract_version: { type: string, const: safety-policy-v1 }
      oneOf:
        - properties: { level: { const: LOW }, reasons: { maxItems: 0 } }
        - properties: { level: { enum: [HIGH, UNKNOWN] }, reasons: { minItems: 1 } }
    QuantityChangeParseResult:
      type: object
      required: [interpretation, quantity, expected_version, ambiguities, schema_version, contract_version]
      properties:
        interpretation: { type: string, enum: [READY, AMBIGUOUS] }
        quantity: { anyOf: [{ $ref: '#/components/schemas/Quantity' }, { type: 'null' }] }
        expected_version: { type: integer, minimum: 1 }
        ambiguities: { type: array, items: { $ref: '#/components/schemas/Ambiguity' } }
        schema_version: { type: string, const: '1' }
        contract_version: { type: string, const: quantity-change-v1 }
    QuantityChangeConfirmRequest:
      type: object
      required: [quantity, expected_version]
      properties:
        quantity: { $ref: '#/components/schemas/Quantity' }
        expected_version: { type: integer, minimum: 1 }
    WorkVersion:
      type: object
      required: [version, lifecycle, state]
      properties:
        version: { type: integer, minimum: 1 }
        lifecycle: { type: string, enum: [PUBLISHED, SUPERSEDED] }
        state: { $ref: '#/components/schemas/StructureV2' }
        ambiguity_override: { type: boolean }
        override_reason: { type: [string, 'null'], enum: [EXPERIENCED_WORKER, IN_PERSON_BRIEFING, OWNER_ACCEPTED_OTHER, null] }
        overridden_at: { type: [string, 'null'], format: date-time }
        transcript: { type: [string, 'null'] }
    OwnerWorkSession:
      type: object
      required: [session_id, current_version, lifecycle, version, contract_version, ontology_version]
      properties:
        session_id: { type: string }
        current_version: { type: integer, minimum: 1 }
        lifecycle: { type: string, const: PUBLISHED }
        version: { $ref: '#/components/schemas/WorkVersion' }
        contract_version: { type: string, const: structure-v2 }
        ontology_version: { type: string, const: ontology-v2 }
        worker_link_meta: { type: array, items: { $ref: '#/components/schemas/WorkerLinkMeta' } }
    WorkerLinkMeta:
      type: object
      required: [language_code, expires_at, revoked_at]
      properties:
        language_code: { type: string, enum: [vi, ne] }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: [string, 'null'], format: date-time }
    IssuedWorkerLink:
      type: object
      required: [language_code, url, expires_at]
      properties:
        language_code: { type: string, enum: [vi, ne] }
        url: { type: string, format: uri, description: Returned only when issued; never persisted or returned by regular reads. }
        expires_at: { type: string, format: date-time }
    InitialPublishResponse:
      type: object
      required: [work_session, issued_worker_links]
      properties:
        work_session: { $ref: '#/components/schemas/OwnerWorkSession' }
        issued_worker_links: { type: array, maxItems: 0, items: { $ref: '#/components/schemas/IssuedWorkerLink' } }
    LegacyWorkSessionRead:
      type: object
      additionalProperties: false
      required: [session_id, current_version, contract_version, ontology_version, read_only]
      properties:
        session_id: { type: string }
        current_version: { type: integer, minimum: 1 }
        contract_version: { type: string, const: structure-v1 }
        ontology_version: { type: string, const: ontology-v1 }
        read_only: { type: boolean, const: true }
    WorkerLinkIssueRequest:
      type: object
      additionalProperties: false
      required: [language_code]
      properties:
        language_code: { type: string, enum: [vi, ne] }
    WorkerLinkIssueResponse:
      type: object
      required: [session_id, issued_worker_links]
      properties:
        session_id: { type: string }
        issued_worker_links: { type: array, minItems: 1, maxItems: 1, items: { $ref: '#/components/schemas/IssuedWorkerLink' } }
    OwnerWorkSessionList:
      type: object
      required: [items]
      properties: { items: { type: array, items: { $ref: '#/components/schemas/OwnerWorkSession' } } }
    WorkerAssignment:
      type: object
      required: [language_code, session_id, version, lifecycle, state, badges]
      properties:
        language_code: { type: string, enum: [vi, ne] }
        session_id: { type: string }
        version: { type: integer, minimum: 1 }
        lifecycle: { type: string, const: PUBLISHED }
        state:
          allOf: [{ $ref: '#/components/schemas/WorkerState' }]
          description: Latest published state; each step contains only translations for this link's language_code.
        badges: { type: array, items: { type: string } }
    Briefing:
      type: object
      required: [session_id, version, language_code, steps]
      properties:
        session_id: { type: string }
        version: { type: integer, minimum: 1 }
        language_code: { type: string, enum: [vi, ne] }
        steps:
          type: array
          minItems: 1
          description: Latest published steps filtered to the requested language_code.
          items: { $ref: '#/components/schemas/Step' }
        demo_badge: { type: [string, 'null'], enum: [DEMO FALLBACK, null] }
    Health:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [ok, ready] }
        request_id: { type: string }
    StructureV2:
      $ref: './schemas/structure-v2.schema.json'
    WorkerBriefing:
      $ref: './schemas/worker-briefing-v2.schema.json'
